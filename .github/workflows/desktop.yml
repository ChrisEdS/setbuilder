name: Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            builder-args: --mac --arm64
          - os: macos-14
            arch: x64
            builder-args: --mac --x64
          - os: ubuntu-22.04
            arch: x64
            builder-args: --linux --x64
          - os: windows-2022
            arch: x64
            builder-args: --win --x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install app
        run: npm ci

      - name: Install desktop shell
        working-directory: desktop
        run: npm ci

      - name: Package
        working-directory: desktop
        run: npm run build && npx electron-builder --publish never ${{ matrix.builder-args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*
          generate_release_notes: true
