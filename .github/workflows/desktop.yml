name: Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            builder-args: --mac --arm64
          - os: macos-14
            arch: x64
            builder-args: --mac --x64
          - os: ubuntu-22.04
            arch: x64
            builder-args: --linux --x64
          - os: windows-2022
            arch: x64
            builder-args: --win --x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install app
        run: npm ci

      - name: Install desktop shell
        working-directory: desktop
        run: npm ci

      - name: Package
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD
          if [ -n "${MAC_CSC_LINK}" ] && [ -n "${MAC_CSC_KEY_PASSWORD}" ]; then
            export CSC_LINK="${MAC_CSC_LINK}"
            export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD}"
          else
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          if [ -z "${WIN_CSC_LINK}" ] || [ -z "${WIN_CSC_KEY_PASSWORD}" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          args="${{ matrix.builder-args }}"
          if [ -z "${CSC_LINK:-}" ] && [[ "$args" == *"--mac"* ]]; then
            args="$args -c.mac.identity=-"
          fi
          npm run build && npx electron-builder --publish never $args

      - name: Server modules shipped
        shell: bash
        run: |
          found=$(find desktop/dist -type d -path '*/setform/node_modules/next' | head -1)
          test -n "$found"
          test -f "$found/package.json"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: setform-${{ matrix.os }}-${{ matrix.arch }}
          path: desktop/dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
