name: Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Test, typecheck, lint, build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install app
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    needs: quality
    runs-on: ${{ matrix.os }}
    env:
      # GitHub release downloads currently answer 504, including the checksum files.
      # These mirrors host the same Electron and electron-builder archives.
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            builder-args: --mac --arm64
          - os: macos-15
            arch: x64
            builder-args: --mac --x64
          - os: ubuntu-22.04
            arch: x64
            builder-args: --linux --x64
          - os: windows-2022
            arch: x64
            builder-args: --win --x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install app
        run: npm ci

      - name: Install desktop shell
        working-directory: desktop
        shell: bash
        run: |
          # GitHub's Electron release CDN often answers 504. npm ci is safe to repeat.
          ok=0
          for attempt in 1 2 3 4 5; do
            if npm ci; then
              ok=1
              break
            fi
            echo "desktop install attempt ${attempt} failed; waiting before retry"
            sleep $((attempt * 30))
          done
          test "$ok" = 1

      - name: Prepare desktop bundle
        working-directory: desktop
        run: npm run build

      - name: Package
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD
          if [ -n "${MAC_CSC_LINK}" ] && [ -n "${MAC_CSC_KEY_PASSWORD}" ]; then
            export CSC_LINK="${MAC_CSC_LINK}"
            export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD}"
          else
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          if [ -z "${WIN_CSC_LINK}" ] || [ -z "${WIN_CSC_KEY_PASSWORD}" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          args="${{ matrix.builder-args }}"
          if [ -z "${CSC_LINK:-}" ] && [[ "$args" == *"--mac"* ]]; then
            args="$args -c.mac.identity=-"
          fi
          ok=0
          for attempt in 1 2 3 4 5; do
            if npx electron-builder --publish never $args; then
              ok=1
              break
            fi
            echo "package attempt ${attempt} failed; waiting before retry"
            sleep $((attempt * 30))
          done
          test "$ok" = 1

      - name: Keep per-arch Mac update metadata
        if: runner.os == 'macOS'
        working-directory: desktop/dist
        shell: bash
        run: |
          if [ -f latest-mac.yml ]; then
            mv latest-mac.yml "latest-mac-${{ matrix.arch }}.yml"
            echo "stored latest-mac-${{ matrix.arch }}.yml"
            cat "latest-mac-${{ matrix.arch }}.yml"
          fi

      - name: Server modules shipped
        shell: bash
        run: |
          found=$(find desktop/dist -type d -path '*/setform/node_modules/next' | head -1)
          test -n "$found"
          test -f "$found/package.json"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: setform-${{ matrix.os }}-${{ matrix.arch }}
          path: desktop/dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    # Only ship when every matrix package succeeded — never publish a half release.
    if: ${{ !cancelled() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare updater metadata
        run: node desktop/scripts/prepare-release-assets.mjs artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
