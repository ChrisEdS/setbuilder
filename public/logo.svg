  <rect x="18" y="32" width="8" height="20" rx="2" fill="#6A6A6A"/>
  <rect x="28" y="22" width="8" height="30" rx="2" fill="#9A9A9A"/>
  <rect x="38" y="12" width="8" height="40" rx="2" fill="#1ED760"/>
  <rect x="48" y="30" width="8" height="22" rx="2" fill="#5A5A5A"/>
